services:
  poptonium:
    build: .
    container_name: poptonium
    restart: unless-stopped
    # Keep the host port at 3654: without a reverse proxy the app probes
    # http://<plex host>:3654, so another host port breaks LAN discovery.
    ports:
      - "3654:8085"
    environment:
      # Plex is required.
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      # Everything below is optional.
      - MDBLIST_API_KEY=${MDBLIST_API_KEY:-}
      - OVERSEERR_URL=${OVERSEERR_URL:-}
      - OVERSEERR_API_KEY=${OVERSEERR_API_KEY:-}
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      - OPENSUBTITLES_USERNAME=${OPENSUBTITLES_USERNAME:-}
      - OPENSUBTITLES_PASSWORD=${OPENSUBTITLES_PASSWORD:-}
      # Only if the media is mounted at different paths than Plex uses (see README).
      - SUBTITLE_PATH_MAP=${SUBTITLE_PATH_MAP:-}
    volumes:
      - ./data:/data
      # Optional: fast subtitles for the Poptonium Cast receiver. Mount your media
      # read-only at the same path Plex sees it, e.g.:
      # - /mnt/user/media/Movies:/movies:ro
      # - /mnt/user/media/TV Shows:/tv:ro
